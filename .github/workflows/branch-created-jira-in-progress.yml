name: Sync Jira Status on Branch Created

on:
  create:

jobs:
  sync-jira-branch:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      # 1. 브랜치명에서 지라 키 추출 ([DEV-16]-login 패턴 등)
      - name: Extract Jira Key
        id: extract_key
        run: |
          BRANCH_NAME="${{ github.event.ref }}"
          echo "Created Branch: $BRANCH_NAME"

          # 대괄호 유무와 상관없이 KAN-01, DEV-16 형태의 지라 키 추출
          JIRA_KEY=$(echo "$BRANCH_NAME" | grep -oE '[A-Z0-9]+-[0-9]+' | head -n 1)

          if [ -n "$JIRA_KEY" ]; then
            echo "Found Jira Key: $JIRA_KEY"
            echo "jira_key=$JIRA_KEY" >> $GITHUB_OUTPUT
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "지라 키가 없는 브랜치입니다. (Skip)"
            echo "has_key=false" >> $GITHUB_OUTPUT
          fi

      # 2. 지라 로그인
      - name: Login to Jira
        if: steps.extract_key.outputs.has_key == 'true'
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      # 3. 백로그 영역에 있는 태스크를 보드 영역으로 이동 (필요 시)
      - name: Move Backlog Issue to Board
        if: steps.extract_key.outputs.has_key == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const jiraKey = "${{ steps.extract_key.outputs.jira_key }}";
            const domain = process.env.JIRA_BASE_URL.replace(/\/$/, "");
            const authHeader = 'Basic ' + Buffer.from(`${process.env.JIRA_USER_EMAIL}:${process.env.JIRA_API_TOKEN}`).toString('base64');

            // Agile API 호출: Backlog 영역에서 Board 영역으로 이슈를 이동
            try {
              const res = await fetch(`${domain}/rest/agile/1.0/backlog/issue/move`, {
                method: 'POST',
                headers: {
                  'Authorization': authHeader,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ issues: [jiraKey] })
              });
              console.log(`Board move API Status: ${res.status}`);
            } catch (err) {
              console.log(`Board move note: ${err.message}`);
            }
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      # 4. 지라 이슈 상태를 '진행 중'으로 변경
      - name: Transition Jira Issue to 'In Progress'
        if: steps.extract_key.outputs.has_key == 'true'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.extract_key.outputs.jira_key }}
          transition: "진행 중" # 지라 컬럼명이 영문이면 "In Progress"로 수정