name: 1. PR Opened -> Move Jira to In Review

on:
  pull_request:
    types: [opened, reopened]

jobs:
  move-jira-to-in-review:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Jira Issue Key from PR Title
        id: extract_key
        run: |
          # PR 제목 예시: "[KAN-01] 로그인 api 머지 요청 #01"
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"
          
          # 정규식을 이용해 대문자 2자 이상 + 하이픈 + 숫자 조합 추출 (예: KAN-01)
          JIRA_KEY=$(echo "$PR_TITLE" | grep -oE '[A-Z0-9]+-[0-9]+' | head -n 1)
          
          if [ -z "$JIRA_KEY" ]; then
            echo "::warning::PR 제목에서 Jira Issue Key를 찾을 수 없습니다."
            echo "has_key=false" >> $GITHUB_OUTPUT
          else
            echo "Found Jira Key: $JIRA_KEY"
            echo "jira_key=$JIRA_KEY" >> $GITHUB_OUTPUT
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      # 1. Jira 로그인 (config.yml 파일 생성)
      - name: Login to Jira
        if: steps.extract_key.outputs.has_key == 'true'
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      # 2. Jira 이슈 상태 변경 ('검토 요청'으로 이동)
      - name: Transition Jira Issue to 'In Review'
        if: steps.extract_key.outputs.has_key == 'true'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.extract_key.outputs.jira_key }}
          transition: "검토 요청" # 또는 transition: "2"